<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0a0f">
    <title>开料优化平台 | Material Cutting Optimization</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-tertiary: #1a1a24;
            --accent-primary: #3b82f6;
            --accent-secondary: #8b5cf6;
            --accent-tertiary: #06b6d4;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border-color: rgba(255, 255, 255, 0.08);
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            color-scheme: dark;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: 
                radial-gradient(ellipse at 10% 20%, rgba(59, 130, 246, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 90% 80%, rgba(139, 92, 246, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(6, 182, 212, 0.08) 0%, transparent 60%);
        }

        .noise {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.03;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 0;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 3rem;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.25rem;
        }

        .logo-text h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .logo-text p {
            font-size: 0.875rem;
            color: var(--text-secondary);
            font-family: 'JetBrains Mono', monospace;
        }

        .nav-tabs {
            display: flex;
            gap: 0.5rem;
            background: var(--bg-secondary);
            padding: 0.375rem;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .nav-tab {
            padding: 0.75rem 1.5rem;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            border-radius: 8px;
            transition: color 0.3s cubic-bezier(0.4, 0, 0.2, 1), background 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .nav-tab:hover {
            color: var(--text-primary);
        }

        .nav-tab:focus-visible {
            outline: 2px solid var(--accent-primary);
            outline-offset: 2px;
        }

        .nav-tab.active {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: white;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .lang-switcher {
            display: flex;
            gap: 0.5rem;
        }

        .lang-btn {
            padding: 0.5rem 1rem;
            border: 1px solid var(--border-color);
            background: var(--bg-secondary);
            color: var(--text-secondary);
            font-family: inherit;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            border-radius: 8px;
            transition: color 0.3s ease, border-color 0.3s ease, background 0.3s ease;
        }

        .lang-btn:hover {
            border-color: var(--accent-primary);
            color: var(--text-primary);
        }

        .lang-btn:focus-visible {
            outline: 2px solid var(--accent-primary);
            outline-offset: 2px;
        }

        .lang-btn.active {
            background: var(--accent-primary);
            border-color: var(--accent-primary);
            color: white;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        @media (max-width: 1200px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2rem;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .panel:hover {
            border-color: rgba(59, 130, 246, 0.3);
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        .panel-title {
            font-size: 1.25rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .panel-title-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(139, 92, 246, 0.2));
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .material-type-tabs {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 2rem;
        }

        .material-type-btn {
            flex: 1;
            padding: 1rem;
            border: 2px solid var(--border-color);
            background: var(--bg-tertiary);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 12px;
            transition: transform 0.3s ease, border-color 0.3s ease, background 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            align-items: center;
        }

        .material-type-btn .icon {
            font-size: 1.75rem;
        }

        .material-type-btn:hover {
            border-color: var(--accent-primary);
            transform: translateY(-2px);
        }

        .material-type-btn:focus-visible {
            outline: 2px solid var(--accent-primary);
            outline-offset: 2px;
        }

        .material-type-btn.active {
            border-color: var(--accent-primary);
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.15), rgba(139, 92, 246, 0.15));
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.15);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .form-input {
            width: 100%;
            padding: 0.875rem 1rem;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-primary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 1rem;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .form-input:focus-visible {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .select-input {
            width: 100%;
            padding: 0.875rem 1rem;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 1rem;
            cursor: pointer;
            transition: border-color 0.3s ease;
        }

        .select-input:focus-visible {
            outline: none;
            border-color: var(--accent-primary);
        }

        .btn {
            padding: 1rem 2rem;
            border: none;
            border-radius: 12px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn:focus-visible {
            outline: 2px solid var(--accent-primary);
            outline-offset: 2px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: white;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(59, 130, 246, 0.4);
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            border-color: var(--accent-primary);
        }

        .btn-small {
            padding: 0.625rem 1rem;
            font-size: 0.875rem;
        }

        .btn-group {
            display: flex;
            gap: 0.75rem;
            margin-top: 1.5rem;
        }

        .pieces-list {
            max-height: 280px;
            overflow-y: auto;
            background: var(--bg-tertiary);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 1.5rem;
        }

        .piece-item {
            display: grid;
            grid-template-columns: 1fr 1fr auto auto;
            gap: 1rem;
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
            align-items: center;
        }

        .piece-item:last-child {
            border-bottom: none;
        }

        .piece-dim {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.95rem;
            color: var(--text-primary);
        }

        .piece-remove {
            width: 32px;
            height: 32px;
            border: none;
            background: rgba(239, 68, 68, 0.1);
            color: var(--error);
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s ease, color 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .piece-remove:hover {
            background: var(--error);
            color: white;
        }

        .piece-remove:focus-visible {
            outline: 2px solid var(--error);
            outline-offset: 2px;
        }

        .results-panel {
            grid-column: 1 / -1;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: linear-gradient(135deg, var(--bg-tertiary), var(--bg-secondary));
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 1.5rem;
            text-align: center;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-primary);
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .canvas-container {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            overflow: auto;
        }

        canvas {
            display: block;
            margin: 0 auto;
            background: #0f0f14;
            border-radius: 8px;
        }

        .material-library {
            margin-top: 2rem;
        }

        .library-list {
            display: grid;
            gap: 1rem;
        }

        .library-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.25rem;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            transition: all 0.3s ease;
        }

        .library-item:hover {
            border-color: var(--accent-primary);
        }

        .library-info h4 {
            font-size: 1rem;
            margin-bottom: 0.25rem;
        }

        .library-info span {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .hidden {
            display: none !important;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in {
            animation: fadeIn 0.5s ease;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }
    </style>
</head>
<body>
    <div class="bg-gradient"></div>
    <div class="noise"></div>
    
    <div class="container">
        <header>
            <div class="logo">
                <div class="logo-icon">✂</div>
                <div class="logo-text">
                    <h1 data-i18n="title">开料优化平台</h1>
                    <p>Material Cutting Optimization</p>
                </div>
            </div>
            
            <div class="nav-tabs">
                <button class="nav-tab active" data-tab="optimizer" data-i18n="tabOptimizer">优化计算</button>
                <button class="nav-tab" data-tab="library" data-i18n="tabLibrary">材料库</button>
            </div>
            
            <div class="lang-switcher">
                <button class="lang-btn active" data-lang="zh">中文</button>
                <button class="lang-btn" data-lang="en">EN</button>
            </div>
        </header>

        <div id="optimizer-view">
            <div class="main-content">
                <div class="panel">
                    <div class="panel-header">
                        <div class="panel-title">
                            <div class="panel-title-icon">📐</div>
                            <span data-i18n="inputSettings">输入设置</span>
                        </div>
                    </div>
                    
                    <div class="material-type-tabs">
                        <button class="material-type-btn active" data-type="sheet" aria-pressed="true">
                            <span class="icon">📋</span>
                            <span data-i18n="sheetMaterial">板材</span>
                        </button>
                        <button class="material-type-btn" data-type="pipe" aria-pressed="false">
                            <span class="icon">🔧</span>
                            <span data-i18n="pipeMaterial">管材</span>
                        </button>
                    </div>

                    <div id="sheet-form">
                        <div class="form-group">
                            <label class="form-label" for="stock-sheet-select" data-i18n="selectStock">选择原料规格</label>
                            <select class="select-input" id="stock-sheet-select" name="stock-sheet"></select>
                        </div>
                        
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label" for="piece-width" data-i18n="pieceWidth">工件宽度 (mm)</label>
                                <input type="number" class="form-input" id="piece-width" name="piece-width" placeholder="例如: 100" min="1" autocomplete="off">
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="piece-height" data-i18n="pieceHeight">工件高度 (mm)</label>
                                <input type="number" class="form-input" id="piece-height" name="piece-height" placeholder="例如: 100" min="1" autocomplete="off">
                            </div>
                        </div>
                        
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label" for="piece-quantity" data-i18n="pieceQuantity">数量</label>
                                <input type="number" class="form-input" id="piece-quantity" name="piece-quantity" placeholder="例如: 1" value="1" min="1" autocomplete="off">
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="saw-kerf" data-i18n="sawKerf">锯缝宽度 (mm)</label>
                                <input type="number" class="form-input" id="saw-kerf" name="saw-kerf" placeholder="例如: 3" value="3" min="0" autocomplete="off">
                            </div>
                        </div>
                    </div>

                    <div id="pipe-form" class="hidden">
                        <div class="form-group">
                            <label class="form-label" for="stock-pipe-select" data-i18n="selectStock">选择原料规格</label>
                            <select class="select-input" id="stock-pipe-select" name="stock-pipe"></select>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label" for="pipe-length" data-i18n="pieceLength">工件长度 (mm)</label>
                            <input type="number" class="form-input" id="pipe-length" name="pipe-length" placeholder="例如: 500" min="1" autocomplete="off">
                        </div>
                        
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label" for="pipe-quantity" data-i18n="pieceQuantity">数量</label>
                                <input type="number" class="form-input" id="pipe-quantity" name="pipe-quantity" placeholder="例如: 1" value="1" min="1" autocomplete="off">
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="pipe-kerf" data-i18n="sawKerf">锯缝宽度 (mm)</label>
                                <input type="number" class="form-input" id="pipe-kerf" name="pipe-kerf" placeholder="例如: 3" value="3" min="0" autocomplete="off">
                            </div>
                        </div>
                    </div>

                    <div class="btn-group">
                        <button class="btn btn-secondary" id="add-piece-btn" aria-label="添加工件">
                            <span>➕</span>
                            <span data-i18n="addPiece">添加工件</span>
                        </button>
                        <button class="btn btn-primary" id="optimize-btn" aria-label="开始优化">
                            <span>⚡</span>
                            <span data-i18n="optimize">开始优化</span>
                        </button>
                    </div>

                    <div class="pieces-list" id="pieces-list">
                        <div style="padding: 2rem; text-align: center; color: var(--text-muted);">
                            <span data-i18n="noPieces">暂无工件，请添加工件</span>
                        </div>
                    </div>
                </div>

                <div class="panel">
                    <div class="panel-header">
                        <div class="panel-title">
                            <div class="panel-title-icon">👁</div>
                            <span data-i18n="preview">预览</span>
                        </div>
                    </div>
                    
                    <div class="canvas-container">
                        <canvas id="preview-canvas" width="600" height="500"></canvas>
                    </div>
                </div>
            </div>

            <div class="panel results-panel hidden" id="results-panel">
                <div class="panel-header">
                    <div class="panel-title">
                        <div class="panel-title-icon">📊</div>
                        <span data-i18n="optimizationResults">优化结果</span>
                    </div>
                </div>

                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-value" id="stat-materials">0</div>
                        <div class="stat-label" data-i18n="materialsNeeded">所需原料</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="stat-utilization">0%</div>
                        <div class="stat-label" data-i18n="utilizationRate">材料利用率</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="stat-pieces">0</div>
                        <div class="stat-label" data-i18n="totalPieces">工件总数</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="stat-waste">0%</div>
                        <div class="stat-label" data-i18n="wasteRate">废料率</div>
                    </div>
                </div>

                <div class="canvas-container">
                    <canvas id="result-canvas" width="1200" height="600"></canvas>
                </div>
            </div>
        </div>

        <div id="library-view" class="hidden">
            <div class="main-content">
                <div class="panel">
                    <div class="panel-header">
                        <div class="panel-title">
                            <div class="panel-title-icon">📦</div>
                            <span data-i18n="sheetLibrary">板材库</span>
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="sheet-stock-width" data-i18n="stockWidth">宽度 (mm)</label>
                            <input type="number" class="form-input" id="sheet-stock-width" name="sheet-stock-width" placeholder="例如: 2440" min="1" autocomplete="off">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="sheet-stock-height" data-i18n="stockHeight">高度 (mm)</label>
                            <input type="number" class="form-input" id="sheet-stock-height" name="sheet-stock-height" placeholder="例如: 1220" min="1" autocomplete="off">
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="sheet-stock-name" data-i18n="materialName">材料名称</label>
                        <input type="text" class="form-input" id="sheet-stock-name" name="sheet-stock-name" placeholder="例如: 标准板材" autocomplete="off">
                    </div>
                    
                    <button class="btn btn-primary" id="add-sheet-stock" aria-label="添加板材">

    <script>

                pieceLength: 'Piece Length (mm)',
                pieceQuantity: 'Quantity',
                sawKerf: 'Saw Kerf (mm)',
                addPiece: 'Add Piece',
                optimize: 'Optimize',
                noPieces: 'No pieces yet, add some',
                preview: 'Preview',
                optimizationResults: 'Results',
                materialsNeeded: 'Stock Needed',
                utilizationRate: 'Utilization',
                totalPieces: 'Total Pieces',
                wasteRate: 'Waste',
                sheetLibrary: 'Sheet Library',
                pipeLibrary: 'Pipe Library',
                stockWidth: 'Width (mm)',

        let currentLang = 'zh';

            { id: 1, name: '标准大板', width: 2440, height: 1220 },

        let pipeLibrary = [
            { id: 1, name: '6米管材', length: 6000 },
            { id: 2, name: '4米管材', length: 4000 },
            { id: 3, name: '3米管材', length: 3000 }
        ];

        const i18n = (key) => translations[currentLang][key] || key;

        function updateLanguage() {
            document.querySelectorAll('[data-i18n]').forEach(el => {

            });

        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.addEventListener('click', () => {

            });

        document.querySelectorAll('.nav-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');

                document.getElementById('library-view').classList.toggle('hidden', currentTab !== 'library');

        document.querySelectorAll('.material-type-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.material-type-btn').forEach(b => {
                    b.classList.remove('active');

                });
                btn.classList.add('active');
                btn.setAttribute('aria-pressed', 'true');
                currentMaterialType = btn.dataset.type;
                document.getElementById('sheet-form').classList.toggle('hidden', currentMaterialType !== 'sheet');
                document.getElementById('pipe-form').classList.toggle('hidden', currentMaterialType !== 'pipe');
                pieces = [];
                renderPieces();
                drawEmptyPreview();
            });
        });

        function initStockSelects() {
            const sheetSelect = document.getElementById('stock-sheet-select');
            const pipeSelect = document.getElementById('stock-pipe-select');
            
            sheetSelect.innerHTML = sheetLibrary.map(s => 
                `<option value="${s.id}">${s.name} (${s.width} × ${s.height} mm)</option>`
            ).join('');
            
            pipeSelect.innerHTML = pipeLibrary.map(p => 
                `<option value="${p.id}">${p.name} (${p.length} mm)</option>`
            ).join('');
        }

        function renderPieces() {
            const list = document.getElementById('pieces-list');
            if (pieces.length === 0) {
                list.innerHTML = `
                    <div style="padding: 2rem; text-align: center; color: var(--text-muted);">
                        <span data-i18n="noPieces">${i18n('noPieces')}</span>
                    </div>
                `;
                return;
            }
            
            list.innerHTML = pieces.map((p, i) => `
                <div class="piece-item">
                    <div class="piece-dim">
                        ${currentMaterialType === 'sheet' ? `${p.width} × ${p.height}` : `${p.length}`} mm
                    </div>
                    <div class="piece-dim">× ${p.quantity}</div>
                    <div></div>
                    <button class="piece-remove" onclick="removePiece(${i})" aria-label="删除工件 ${i + 1}">✕</button>
                </div>
            `).join('');
        }

        function removePiece(index) {
            pieces.splice(index, 1);
            renderPieces();
        }

        document.getElementById('add-piece-btn').addEventListener('click', () => {
            if (currentMaterialType === 'sheet') {
                const width = parseFloat(document.getElementById('piece-width').value);
                const height = parseFloat(document.getElementById('piece-height').value);
                const quantity = parseInt(document.getElementById('piece-quantity').value) || 1;
                
                if (width && height) {
                    pieces.push({ width, height, quantity });
                    renderPieces();
                    document.getElementById('piece-width').value = '';
                    document.getElementById('piece-height').value = '';
                    document.getElementById('piece-quantity').value = '1';
                }
            } else {
                const length = parseFloat(document.getElementById('pipe-length').value);
                const quantity = parseInt(document.getElementById('pipe-quantity').value) || 1;
                
                if (length) {
                    pieces.push({ length, quantity });
                    renderPieces();
                    document.getElementById('pipe-length').value = '';
                    document.getElementById('pipe-quantity').value = '1';
                }
            }
        });

        document.getElementById('optimize-btn').addEventListener('click', () => {
            if (pieces.length === 0) {
                alert(currentLang === 'zh' ? '请先添加工件' : 'Please add pieces first');
                return;
            }
            
            if (currentMaterialType === 'sheet') {
                optimizeSheet();
            } else {
                optimizePipe();
            }
        });

        function optimizeSheet() {
            const stockId = parseInt(document.getElementById('stock-sheet-select').value);
            const stock = sheetLibrary.find(s => s.id === stockId);
            const kerf = parseFloat(document.getElementById('saw-kerf').value) || 0;
            
            const results = performSheetOptimization(stock, pieces, kerf);
            displayResults(results, stock);
        }

        function optimizePipe() {
            const stockId = parseInt(document.getElementById('stock-pipe-select').value);
            const stock = pipeLibrary.find(p => p.id === stockId);
            const kerf = parseFloat(document.getElementById('pipe-kerf').value) || 0;
            
            const results = performPipeOptimization(stock, pieces, kerf);
            displayResults(results, stock);
        }

        function performSheetOptimization(stock, pieces, kerf) {
            let allPieces = [];
            pieces.forEach(p => {
                for (let i = 0; i < p.quantity; i++) {
                    allPieces.push({ w: p.width, h: p.height, rotatable: true });
                }
            });
            
            let usedStock = 0;
            let layouts = [];
            let remaining = [...allPieces];
            
            while (remaining.length > 0) {
                const layout = greedyPack(stock.width, stock.height, remaining, kerf);
                layouts.push(layout);
                usedStock++;
                remaining = layout.remaining;
            }
            
            const totalArea = usedStock * stock.width * stock.height;
            const usedArea = allPieces.reduce((sum, p) => sum + p.w * p.h, 0);
            const utilization = totalArea > 0 ? (usedArea / totalArea * 100).toFixed(1) : 0;
            
            return {
                layouts,
                usedStock,
                utilization,
                totalPieces: allPieces.length,
                waste: (100 - utilization).toFixed(1),
                type: 'sheet',
                stock
            };
        }

        function greedyPack(stockW, stockH, pieces, kerf) {
            let placed = [];
            let remaining = [...pieces];
            let freeRects = [{ x: 0, y: 0, w: stockW, h: stockH }];
            
            for (let i = remaining.length - 1; i >= 0; i--) {
                const p = remaining[i];
                let placedFlag = false;
                
                for (let j = 0; j < freeRects.length; j++) {
                    const fr = freeRects[j];
                    if (tryPlace(p, fr, placed, freeRects, j, kerf)) {
                        remaining.splice(i, 1);
                        placedFlag = true;
                        break;
                    }
                    
                    if (p.rotatable) {
                        const rotated = { w: p.h, h: p.w, rotatable: true, rotated: true, originalW: p.w, originalH: p.h };
                        if (tryPlace(rotated, fr, placed, freeRects, j, kerf)) {
                            remaining.splice(i, 1);
                            placedFlag = true;
                            break;
                        }
                    }
                }
            }
            
            return { placed, remaining };
        }

        function tryPlace(p, fr, placed, freeRects, frIdx, kerf) {
            if (p.w <= fr.w && p.h <= fr.h) {
                placed.push({
                    x: fr.x,
                    y: fr.y,
                    w: p.w,
                    h: p.h,
                    rotated: p.rotated || false
                });
                
                freeRects.splice(frIdx, 1);
                
                if (fr.w - p.w - kerf > 0) {
                    freeRects.push({ x: fr.x + p.w + kerf, y: fr.y, w: fr.w - p.w - kerf, h: fr.h });
                }
                if (fr.h - p.h - kerf > 0) {
                    freeRects.push({ x: fr.x, y: fr.y + p.h + kerf, w: p.w, h: fr.h - p.h - kerf });
                }
                
                return true;
            }
            return false;
        }

        function performPipeOptimization(stock, pieces, kerf) {
            let allPieces = [];
            pieces.forEach(p => {
                for (let i = 0; i < p.quantity; i++) {
                    allPieces.push(p.length);
                }
            });
            
            allPieces.sort((a, b) => b - a);
            
            let usedStock = 0;
            let cuts = [];
            let remaining = [...allPieces];
            
            while (remaining.length > 0) {
                const result = firstFitDecreasing(stock.length, remaining, kerf);
                cuts.push(result.cut);
                usedStock++;
                remaining = result.remaining;
            }
            
            const totalLength = usedStock * stock.length;
            const usedLength = allPieces.reduce((sum, l) => sum + l, 0);
            const utilization = totalLength > 0 ? (usedLength / totalLength * 100).toFixed(1) : 0;
            
            return {
                cuts,
                usedStock,
                utilization,
                totalPieces: allPieces.length,
                waste: (100 - utilization).toFixed(1),
                type: 'pipe',
                stock
            };
        }

        function firstFitDecreasing(stockLen, pieces, kerf) {
            let remaining = [...pieces];
            let cut = [];
            let used = 0;
            
            for (let i = remaining.length - 1; i >= 0; i--) {
                const len = remaining[i];
                if (used + len + (cut.length > 0 ? kerf : 0) <= stockLen) {
                    cut.push({
                        start: used + (cut.length > 0 ? kerf : 0),
                        length: len
                    });
                    used += len + (cut.length > 1 ? kerf : 0);
                    remaining.splice(i, 1);
                }
            }
            
            return { cut, remaining };
        }

        function displayResults(results, stock) {
            document.getElementById('results-panel').classList.remove('hidden');
            document.getElementById('results-panel').classList.add('fade-in');
            document.getElementById('stat-materials').textContent = results.usedStock;
            document.getElementById('stat-utilization').textContent = results.utilization + '%';
            document.getElementById('stat-pieces').textContent = results.totalPieces;
            document.getElementById('stat-waste').textContent = results.waste + '%';
            
            drawResults(results);
        }

        function drawEmptyPreview() {
            const canvas = document.getElementById('preview-canvas');
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#0f0f14';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#64748b';
            ctx.font = '14px Space Grotesk';
            ctx.textAlign = 'center';
            ctx.fillText(currentLang === 'zh' ? '优化后预览将显示在这里' : 'Optimization preview will appear here', canvas.width / 2, canvas.height / 2);
        }

        function drawResults(results) {
            const canvas = document.getElementById('result-canvas');
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#0f0f14';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            if (results.type === 'sheet') {
                drawSheetResults(ctx, results);
            } else {
                drawPipeResults(ctx, results);
            }
            
            drawPreviewFromResults(results);
        }

        function drawSheetResults(ctx, results) {
            const stockW = results.stock.width;
            const stockH = results.stock.height;
            const maxW = 350;
            const scale = Math.min(maxW / stockW, 280 / stockH);
            const drawW = stockW * scale;
            const drawH = stockH * scale;
            
            const cols = 3;
            const padding = 30;
            const cardW = drawW + padding * 2;
            const cardH = drawH + 70;
            
            results.layouts.forEach((layout, idx) => {
                const col = idx % cols;
                const row = Math.floor(idx / cols);
                const x = col * (cardW + 30) + 40;
                const y = row * (cardH + 30) + 40;
                
                ctx.fillStyle = '#1a1a24';
                ctx.strokeStyle = 'rgba(59, 130, 246, 0.3)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.roundRect(x, y, cardW, cardH, 12);
                ctx.fill();
                ctx.stroke();
                
                ctx.fillStyle = '#f8fafc';
                ctx.font = '600 14px Space Grotesk';
                ctx.fillText(`${currentLang === 'zh' ? '原料' : 'Stock'} #${idx + 1}`, x + padding, y + 28);
                
                const boardX = x + padding;
                const boardY = y + 45;
                
                ctx.fillStyle = '#12121a';
                ctx.strokeStyle = '#3b82f6';
                ctx.lineWidth = 2;
                ctx.fillRect(boardX, boardY, drawW, drawH);
                ctx.strokeRect(boardX, boardY, drawW, drawH);
                
                const colors = ['#3b82f6', '#8b5cf6', '#06b6d4', '#10b981', '#f59e0b', '#ec4899'];
                layout.placed.forEach((p, i) => {
                    const px = boardX + p.x * scale;
                    const py = boardY + p.y * scale;
                    const pw = p.w * scale;
                    const ph = p.h * scale;
                    
                    ctx.fillStyle = colors[i % colors.length] + '40';
                    ctx.strokeStyle = colors[i % colors.length];
                    ctx.lineWidth = 2;
                    ctx.fillRect(px, py, pw, ph);
                    ctx.strokeRect(px, py, pw, ph);
                    
                    if (pw > 30 && ph > 15) {
                        ctx.fillStyle = '#f8fafc';
                        ctx.font = '10px JetBrains Mono';
                        ctx.textAlign = 'center';
                        ctx.fillText(`${p.w}×${p.h}`, px + pw/2, py + ph/2 + 4);
                    }
                });
            });
        }

        function drawPipeResults(ctx, results) {
            const stockLen = results.stock.length;
            const maxW = 1000;
            const scale = Math.min(maxW / stockLen, 1);
            const drawW = stockLen * scale;
            const drawH = 50;
            
            results.cuts.forEach((cut, idx) => {
                const x = 40;
                const y = idx * (drawH + 60) + 40;
                
                ctx.fillStyle = '#1a1a24';
                ctx.strokeStyle = 'rgba(59, 130, 246, 0.3)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.roundRect(x - 10, y - 10, drawW + 20, drawH + 50, 12);
                ctx.fill();
                ctx.stroke();
                
                ctx.fillStyle = '#f8fafc';
                ctx.font = '600 14px Space Grotesk';
                ctx.fillText(`${currentLang === 'zh' ? '原料' : 'Stock'} #${idx + 1}`, x, y + 2);
                
                const pipeY = y + 25;
                
                ctx.fillStyle = '#12121a';
                ctx.strokeStyle = '#3b82f6';
                ctx.lineWidth = 3;
                ctx.fillRect(x, pipeY, drawW, drawH);
                ctx.strokeRect(x, pipeY, drawW, drawH);
                
                const colors = ['#3b82f6', '#8b5cf6', '#06b6d4', '#10b981', '#f59e0b', '#ec4899'];
                cut.forEach((c, i) => {
                    const cx = x + c.start * scale;
                    const cw = c.length * scale;
                    
                    ctx.fillStyle = colors[i % colors.length] + '50';
                    ctx.strokeStyle = colors[i % colors.length];
                    ctx.lineWidth = 2;
                    ctx.fillRect(cx, pipeY, cw, drawH);
                    ctx.strokeRect(cx, pipeY, cw, drawH);
                    
                    if (cw > 40) {
                        ctx.fillStyle = '#f8fafc';
                        ctx.font = '11px JetBrains Mono';
                        ctx.textAlign = 'center';
                        ctx.fillText(`${c.length}`, cx + cw/2, pipeY + drawH/2 + 4);
                    }
                });
            });
        }

        function drawPreviewFromResults(results) {
            const canvas = document.getElementById('preview-canvas');
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#0f0f14';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            if (results.type === 'sheet' && results.layouts.length > 0) {
                const stock = results.stock;
                const scale = Math.min(520 / stock.width, 420 / stock.height);
                const drawW = stock.width * scale;
                const drawH = stock.height * scale;
                const x = (canvas.width - drawW) / 2;
                const y = (canvas.height - drawH) / 2;
                
                ctx.fillStyle = '#1a1a24';
                ctx.strokeStyle = '#3b82f6';
                ctx.lineWidth = 2;
                ctx.fillRect(x, y, drawW, drawH);
                ctx.strokeRect(x, y, drawW, drawH);
                
                const colors = ['#3b82f6', '#8b5cf6', '#06b6d4', '#10b981', '#f59e0b'];
                results.layouts[0].placed.forEach((p, i) => {
                    const px = x + p.x * scale;
                    const py = y + p.y * scale;
                    const pw = p.w * scale;
                    const ph = p.h * scale;
                    
                    ctx.fillStyle = colors[i % colors.length] + '40';
                    ctx.strokeStyle = colors[i % colors.length];
                    ctx.fillRect(px, py, pw, ph);
                    ctx.strokeRect(px, py, pw, ph);
                });
            } else if (results.type === 'pipe' && results.cuts.length > 0) {
                const stock = results.stock;
                const scale = Math.min(520 / stock.length, 1);
                const drawW = stock.length * scale;
                const drawH = 60;
                const x = (canvas.width - drawW) / 2;
                const y = (canvas.height - drawH) / 2;
                
                ctx.fillStyle = '#1a1a24';
                ctx.strokeStyle = '#3b82f6';
                ctx.lineWidth = 3;
                ctx.fillRect(x, y, drawW, drawH);
                ctx.strokeRect(x, y, drawW, drawH);
                
                const colors = ['#3b82f6', '#8b5cf6', '#06b6d4', '#10b981', '#f59e0b'];
                results.cuts[0].forEach((c, i) => {
                    const cx = x + c.start * scale;
                    const cw = c.length * scale;
                    
                    ctx.fillStyle = colors[i % colors.length] + '50';
                    ctx.strokeStyle = colors[i % colors.length];
                    ctx.fillRect(cx, y, cw, drawH);
                    ctx.strokeRect(cx, y, cw, drawH);
                });
            }
        }

        function renderLibrary() {
            const sheetList = document.getElementById('sheet-library-list');
            const pipeList = document.getElementById('pipe-library-list');
            
            sheetList.innerHTML = sheetLibrary.map(s => `
                <div class="library-item">
                    <div class="library-info">
                        <h4>${s.name}</h4>
                        <span>${s.width} × ${s.height} mm</span>
                    </div>
                    <button class="btn btn-secondary btn-small" onclick="removeSheetStock(${s.id})" aria-label="删除板材 ${s.name}">
                        删除
                    </button>
                </div>
            `).join('');
            
            pipeList.innerHTML = pipeLibrary.map(p => `
                <div class="library-item">
                    <div class="library-info">
                        <h4>${p.name}</h4>
                        <span>${p.length} mm</span>
                    </div>
                    <button class="btn btn-secondary btn-small" onclick="removePipeStock(${p.id})" aria-label="删除管材 ${p.name}">
                        删除
                    </button>
                </div>
            `).join('');
        }

        document.getElementById('add-sheet-stock').addEventListener('click', () => {
            const width = parseFloat(document.getElementById('sheet-stock-width').value);
            const height = parseFloat(document.getElementById('sheet-stock-height').value);
            const name = document.getElementById('sheet-stock-name').value || '自定义板材';
            
            if (width && height) {
                sheetLibrary.push({ id: Date.now(), name, width, height });
                renderLibrary();
                initStockSelects();
                document.getElementById('sheet-stock-width').value = '';
                document.getElementById('sheet-stock-height').value = '';
                document.getElementById('sheet-stock-name').value = '';
            }
        });

        document.getElementById('add-pipe-stock').addEventListener('click', () => {
            const length = parseFloat(document.getElementById('pipe-stock-length').value);
            const name = document.getElementById('pipe-stock-name').value || '自定义管材';
            
            if (length) {
                pipeLibrary.push({ id: Date.now(), name, length });
                renderLibrary();
                initStockSelects();
                document.getElementById('pipe-stock-length').value = '';
                document.getElementById('pipe-stock-name').value = '';
            }
        });

        function removeSheetStock(id) {
            sheetLibrary = sheetLibrary.filter(s => s.id !== id);
            renderLibrary();
            initStockSelects();
        }

        function removePipeStock(id) {
            pipeLibrary = pipeLibrary.filter(p => p.id !== id);
            renderLibrary();
            initStockSelects();
        }
