<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>材料切割优化工具</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>材料切割优化工具</h1>
    </div>
    
    <div class="tabs">
      <button class="tab active" data-type="sheet">板材优化</button>
      <button class="tab" data-type="pipe">管材优化</button>
    </div>
    
    <div id="sheet-panel" class="panel">
      <h2>板材参数设置</h2>
      <div class="form-row">
        <div class="form-group">
          <label>原材料规格</label>
          <select id="sheet-stock-select">
            <option value="1">标准板 1220×2440 mm</option>
            <option value="2">标准板 1220×1830 mm</option>
            <option value="3">标准板 915×1830 mm</option>
            <option value="4">标准板 1500×3000 mm</option>
          </select>
        </div>
        <div class="form-group">
          <label>锯缝宽度 (mm)</label>
          <input type="number" id="sheet-kerf" value="3" min="0" step="0.1">
        </div>
      </div>
      
      <h2>添加工件尺寸</h2>
      <div class="form-row">
        <div class="form-group">
          <label>宽度 (mm)</label>
          <input type="number" id="sheet-width" placeholder="输入宽度">
        </div>
        <div class="form-group">
          <label>高度 (mm)</label>
          <input type="number" id="sheet-height" placeholder="输入高度">
        </div>
        <div class="form-group">
          <label>数量</label>
          <input type="number" id="sheet-quantity" value="1" min="1">
        </div>
        <button class="btn btn-primary" id="add-sheet-piece">添加工件</button>
      </div>
      
      <div class="pieces-list" id="sheet-pieces"></div>
    </div>
    
    <div id="pipe-panel" class="panel hidden">
      <h2>管材参数设置</h2>
      <div class="form-row">
        <div class="form-group">
          <label>原材料规格</label>
          <select id="pipe-stock-select">
            <option value="1">标准管 6000 mm</option>
            <option value="2">标准管 4000 mm</option>
            <option value="3">标准管 3000 mm</option>
            <option value="4">标准管 2000 mm</option>
          </select>
        </div>
        <div class="form-group">
          <label>锯缝宽度 (mm)</label>
          <input type="number" id="pipe-kerf" value="3" min="0" step="0.1">
        </div>
      </div>
      
      <h2>添加工件尺寸</h2>
      <div class="form-row">
        <div class="form-group">
          <label>长度 (mm)</label>
          <input type="number" id="pipe-length" placeholder="输入长度">
        </div>
        <div class="form-group">
          <label>数量</label>
          <input type="number" id="pipe-quantity" value="1" min="1">
        </div>
        <button class="btn btn-primary" id="add-pipe-piece">添加工件</button>
      </div>
      
      <div class="pieces-list" id="pipe-pieces"></div>
    </div>
    
    <button class="btn btn-primary" style="width: 100%; padding: 12px; font-size: 16px;" id="optimize-btn">开始优化计算</button>
    
    <div class="stats" id="stats" style="display: none;">
      <div class="stat-card">
        <div class="label">使用原料数</div>
        <div class="value" id="stat-materials">0</div>
      </div>
      <div class="stat-card high">
        <div class="label">材料利用率</div>
        <div class="value" id="stat-utilization">0%</div>
      </div>
      <div class="stat-card">
        <div class="label">工件总数</div>
        <div class="value" id="stat-pieces">0</div>
      </div>
      <div class="stat-card low">
        <div class="label">废料率</div>
        <div class="value" id="stat-waste">0%</div>
      </div>
    </div>
    
    <div class="panel" id="result-panel" style="display: none;">
      <h2>优化结果预览</h2>
      <div class="canvas-container">
        <canvas id="result-canvas" width="1100" height="600"></canvas>
      </div>
    </div>
  </div>
  
  <script type="module" src="js/script.js"></script>
</body>
</html>
